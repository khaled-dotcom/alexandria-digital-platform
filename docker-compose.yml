services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      # وراك بروكسي (nginx/Caddy) — مهم عشان حد الطلبات يقرأ الـ IP صح
      TRUST_PROXY: "1"
      SESSION_SECRET: ${SESSION_SECRET:?لازم تظبط SESSION_SECRET في ملف .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_ENDPOINT: ${SMS_ENDPOINT:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-Alexandria}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # البيانات والصور برّه الحاوية عشان الترقية متضيعهاش
      - alx-data:/app/data
      - alx-uploads:/app/uploads
      - alx-backups:/app/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # نسخة احتياطية يومية — بتشتغل وتقف
  backup:
    build: .
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "while true; do
         sleep 86400;
         node scripts/backup.js || echo 'فشلت النسخة الاحتياطية';
       done"
    volumes:
      - alx-data:/app/data
      - alx-uploads:/app/uploads
      - alx-backups:/app/backups
    depends_on:
      - app

volumes:
  alx-data:
  alx-uploads:
  alx-backups:
